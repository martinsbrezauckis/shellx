# ShellX Vault vendored workspace for ShellX desktop.
# Members: core (crypto/chunking/manifest), client sync engine, embedded server.
[workspace]
resolver = "2"
members = [
    "crates/vault-core",
    "crates/vault-server",
    "crates/vault-client",
    "crates/vault-broker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Martins"]

# Dependency versions are pinned here once, used by member crates via
# `workspace = true`. Versions verified on crates.io 2026-06-10.
[workspace.dependencies]
vault-core = { path = "crates/vault-core" }
vault-client = { path = "crates/vault-client" }
vault-broker = { path = "crates/vault-broker" }

# crypto
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
# 2.0 stable (3.0 is an RC — same policy as chacha 0.11 RC: wait for final).
# static_secrets: deposit recipient secret is DERIVED from the master key.
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
blake3 = "1.8"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# data
fastcdc = "4.0.1"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.13"
hex = "0.4"
base64 = "0.22"
png = "0.17"

# server + client
axum = "0.8.9"
tower-http = { version = "0.6", features = ["timeout"] }
# reqwest 0.13: rustls default; `json` and `stream` are opt-in features now
reqwest = { version = "0.13", features = ["json"] }
walkdir = "2.5"
globset = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
rpassword = "7.5"
futures-util = "0.3"
anyhow = "1"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "fs", "signal"] }
clap = { version = "4.6", features = ["derive"] }
memory-serve = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"

# misc
thiserror = "2"
libc = "0.2"

# test-only
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
