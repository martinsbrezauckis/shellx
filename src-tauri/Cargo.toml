# src-tauri/Cargo.toml
#
# Rust backend for the ShellX Tauri app.
#
# Architecture: ShellX hosts Grok Build, Claude Code, Codex CLI, and
# ACP-speaking agents through bounded native adapters. Its local JSON-RPC
# framing stays explicit where an adapter requires it, so protocol boundaries
# remain inspectable.
#
# The default `debug-api` feature enables the loopback axum HTTP/WS surface
# used by ShellX-launched agents and trusted diagnostics.

[package]
name = "shellx"
version = "0.3.62"
description = "shellX — cross-platform desktop host for Grok Build, Claude Code, Codex CLI, and ACP-speaking agents"
authors = ["Martins Brezauckis <martins.brezauckis@gmail.com>"]
license = "MIT"
repository = "https://github.com/martinsbrezauckis/shellx"
edition = "2021"
rust-version = "1.89"
autoexamples = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "task_execution_runtime"
path = "public/tests/integration/task_execution_runtime.rs"

[[test]]
name = "shellx_browser"
path = "public/tests/integration/shellx_browser.rs"

[[test]]
name = "provider_adapters"
path = "public/tests/integration/provider_adapters.rs"

[[test]]
name = "shellx_browser_evaluations"
path = "public/tests/integration/shellx_browser_evaluations.rs"

[[test]]
name = "shellx_browser_flight_recorder"
path = "public/tests/integration/shellx_browser_flight_recorder.rs"

[[test]]
name = "task_schedule"
path = "public/tests/integration/task_schedule.rs"

[[test]]
name = "skill_install_e2e"
path = "public/tests/integration/skill_install_e2e.rs"

[[test]]
name = "task_provider_fallback"
path = "public/tests/integration/task_provider_fallback.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1"

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset", "unstable"] }
# Keep Tauri's WebView runtime on the same Wry minor as ShellX's download patch.
tauri-runtime-wry = { version = "=2.11.4", default-features = false }
tauri-plugin-log = "2.9"
# Native dialog integration for attachment and workspace-folder selection.
tauri-plugin-dialog = "2"

# JSON-RPC frames + general (de)serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tempfile = "3"
url = "2"

# Async runtime for spawning agent processes and piping stdio.
tokio = { version = "1", features = ["full"] }

# Structured logs (info!/warn!/error!) used inside acp.rs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# log facade — tauri-plugin-log uses it; keep for compatibility
log = "0.4"

# Agent-first loopback debug surface (HTTP+WS server). This is enabled by the
# default feature set below; `--no-default-features` is the explicit opt-out.
axum = { version = "0.7", features = ["ws", "json"], optional = true }
# CORS preflight handling. Windows WebView2 origin is
# `http://tauri.localhost`; fetches to `http://127.0.0.1:5757` with the
# Authorization header trigger a CORS preflight OPTIONS. Without a
# matching response, the browser blocks the actual GET and reports
# "Failed to fetch". Linux
# dev works because Vite + the API both run on `localhost` (same origin
# = no preflight). tower-http's CorsLayer responds to OPTIONS with the
# right Access-Control-Allow-* headers for the loopback origins we
# already allow in origin_allowed().
tower-http = { version = "0.5", features = ["cors", "catch-panic", "fs"], optional = true }

# Native host tools:
#   notify       — filesystem watcher backing the fs_watch host tool.
#   sysinfo      — cross-platform cpu/rss/vsz/threads for process_stats.
#   nix (Unix)   — Unix signal sending (SIGTERM/SIGINT/SIGKILL/SIGHUP/SIGUSR1)
#                  used by process_signal. Windows falls back to taskkill.
notify = "6"
sysinfo = "0.30"

# Vault storage and identity dependencies:
#   keyring               — cross-platform OS-keyring master-key store.
#                           Linux uses secret-service; macOS Keychain;
#                           Windows Credential Manager. Single source of
#                           truth for the 256-bit master encryption key.
#   chacha20poly1305      — AEAD cipher for envelope-encrypting the vault
#                           blob. Chosen over aes-gcm because (a) modern,
#                           constant-time on hardware that lacks AES-NI,
#                           (b) no nonce-reuse footguns at our scale, and
#                           (c) the RustCrypto implementation is audited.
#                           96-bit nonce, 256-bit key, 128-bit tag.
#   base64                — envelope-encode the ciphertext+nonce for the
#                           on-disk JSON. No raw bytes ever touch disk in
#                           the JSON envelope.
#   rand                  — CSPRNG for nonces (OsRng under the hood).
#   zeroize               — clear transient key/plaintext buffers after use.
#   uuid                  — stable connection-preset identifiers.
keyring = "2"
chacha20poly1305 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
arboard = "3"
vault-core = { path = "../vendor/shellx-vault/crates/vault-core" }
vault-client = { path = "../vendor/shellx-vault/crates/vault-client" }
vault-server = { path = "../vendor/shellx-vault/crates/vault-server" }
vault-broker = { path = "../vendor/shellx-vault/crates/vault-broker" }
blake3 = "1"
hex = "0.4"
tauri-plugin-updater = "=2.10.1"
minisign-verify = "0.2.5"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# Single-instance guard: ensures only one ShellX instance runs. A second
# launch (clicking shortcut while window is open, or upgrade-time
# race where installer launches new instance before old fully exits)
# focuses the existing window instead of spawning a second app.exe.
# Pairs with retry-bind in mcp_http/debug_api to survive transient
# TIME_WAIT after a clean shutdown.
# Deep links delivered to an existing desktop instance must first pass through
# the deep-link plugin; its single-instance integration forwards only the
# statically configured scheme to the existing process.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2.4.9"

# Voice transcription HTTP client. `multipart` supports audio uploads;
# `rustls-tls` cross-compiles without a system OpenSSL dependency. Gzip stays
# off because transcription responses are small JSON.
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Cross-platform PTY library. A single
# `native_pty_system()` API returns a Unix-PTY implementation on Linux/macOS
# and a ConPTY implementation on Windows — no per-platform forks here.
# MIT-licensed, production-hardened (wezterm + zellij both ship it).
# Cross-compile note: portable-pty depends on `nix` (already in the tree) on
# Unix and `winapi` on Windows; both work under cargo-xwin without extra
# lib.exe gymnastics, so the Windows build path remains green.
portable-pty = "0.8"
# PTY output is read into 8 KiB chunks before fanning out to xterm.js.
# `bytes::Bytes` cheap-clones the buffer for the broadcast subscribers and
# avoids per-chunk allocations on the hot path.
bytes = "1"

# SHA-256 for `host_skill_status` body-hash drift detection. Settings compares
# the on-disk manifest against the bundled body without reading and diffing it
# on every poll.
sha2 = "0.10"

# SQLite backend for the cross-tab durable kv store
# (host_mem.rs). `bundled` feature compiles SQLite C from source via the
# `cc` crate — no system libsqlite3 or pkg-config required, so cargo-xwin
# Windows builds stay clean (same reason `reqwest` uses rustls-tls and
# not native-tls). The whole rusqlite surface we use is synchronous; the
# host_mem module parks every call inside `tokio::task::spawn_blocking`
# so the MCP dispatcher never holds a Connection across an .await point.
rusqlite = { version = "0.41", features = ["bundled"] }

# net_fetch allow-list parser for `~/.shellx/net_allow.toml`,
# the host-allow list that gates which URLs the `net_fetch` MCP tool may
# actually reach. We use the same crate version family as serde_spanned
# elsewhere in the dependency tree, so this is a near-zero compile cost
# add. `default-features` left on — we want the basic deserializer path.
toml = "0.8"

# Host MCP `clock_now`: chrono already lives in the tree
# transitively (iana-time-zone + serde + Windows backend) — make it an
# explicit dep so the formatter for ISO-8601 / RFC-3339 strings is part
# of our API contract. `default-features = false` + `clock` keeps the
# wasm-only / oldtime baggage out; `serde` is harmless and matches the
# transitive feature set so the resolver picks the same chrono build.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Task scheduling needs an embedded IANA timezone database. `chrono` can format
# local time, but cannot validate arbitrary named zones or resolve their DST
# transitions without `chrono-tz`.
chrono-tz = "0.10"
# Resolve the computer's IANA timezone when a chat-authorized Task omits an
# explicit location. The crate already exists in the lockfile through chrono;
# declaring it directly makes this runtime dependency intentional.
iana-time-zone = "0.1"

# Host MCP `fs_grep` regex-over-files tool. The
# `ignore` crate is ripgrep's workhorse — respects .gitignore, hidden-
# file rules, parallel walk if we ever want it. `regex` for the pattern
# itself. Together ~2 MB of binary growth which is acceptable since we
# already ship rusqlite (~1 MB) + portable-pty + chrono with similar
# weight. Without these grok ends up spawning Agent subagents to shell
# `grep -r`, which costs ~8-10 s per call in verification probes.
ignore = "0.4"
regex = "1.11"

# Session artifact download packages the workspace and agent
# session scratch dir into one zip. `zip` v2.x supports both writing
# and reading; we only need the writer. `deflate` is the standard
# compression — keeps the dep tree slim by skipping bzip2/zstd/lzma
# features. `walkdir` recurses the cwd; the `ignore` crate would also
# work but its .gitignore semantics aren't appropriate for a "give me
# every byte" archive.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
walkdir = "2"

# Native window screenshot capture. `xcap` 0.1.1 builds cleanly on Linux and
# Windows without extra PipeWire development packages. macOS needs 0.9.x because
# 0.1.1 fails to compile on current Apple Rust toolchains.
[target.'cfg(target_os = "macos")'.dependencies]
xcap = "0.9.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSWindow", "NSView"] }
wry = { version = "=0.55.1", default-features = false }

[target.'cfg(not(target_os = "macos"))'.dependencies]
xcap = "0.1.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"
raw-window-handle = "0.6"
webkit2gtk = "2.0.2"
gtk = "0.18"
cairo-rs = { version = "0.18.5", features = ["png"] }

# Windows screenshot capture. xcap does not reliably enumerate the
# ShellX WebView window on Windows, so this uses Tauri's main-window HWND and
# PrintWindow against it. PW_RENDERFULLCONTENT (flag 0x2) is the
# critical flag — without it WebView2 renders blank to the bitmap
# DC because the modern compositor draws to its own surface.
#
# windows-sys 0.61 chosen because it's already heavily present in
# the transitive dep tree (see Cargo.lock — 12 instances) so adding
# it here costs ~0 KB of additional binary footprint.
[target.'cfg(windows)'.dependencies]
# The stage-keyed WebView2 download adapter observer uses this exact patched
# Wry crate; it does not change the resolved package or enable default features.
wry = { version = "=0.55.1", default-features = false }
webview2-com = "0.38.2"
windows = "0.61"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
    # Kill-on-close Job Object so Grok, WSL, and
    # ssh.exe children are reaped when shellX itself dies (crash, taskkill,
    # logoff). Without this, an installer-killed shellX leaves orphans on
    # Windows. Pairs with PR_SET_PDEATHSIG on Unix (via nix crate).
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_Security",
    # Dynamic LoadLibraryW + GetProcAddress resolves
    # NtSuspendProcess / NtResumeProcess from ntdll for proper
    # Windows pause/resume (parity with Unix SIGSTOP/SIGCONT).
    "Win32_System_LibraryLoader",
] }

[features]
# The Debug API is part of ShellX's shipped agent and diagnostic surface.
# It remains a default feature; `--no-default-features` is the explicit
# minimal-build opt-out.
default = ["debug-api"]
debug-api = ["dep:axum", "dep:tower-http"]
# Test-only Windows linker support. Production builds do not select it.
windows-test-manifest = []

[dev-dependencies]

# notify-rust 4.18 uses the 0.7.x Windows toast wrapper API; retain the
# compatible patched source for that dependency interface.
[patch.crates-io]
tao = { path = "../vendor/tao-0.35.2" }
wry = { path = "../vendor/wry-0.55.1" }
tauri-plugin-updater = { path = "../vendor/tauri-plugin-updater-2.10.1" }
glib = { path = "../vendor/glib" }
tauri-winrt-notification = { path = "../vendor/tauri-winrt-notification" }
