# shellX CI — pre-merge checks
#
# Runs on every push + pull request against any branch. Gates:
# - Frontend type-check (tsc)
# - Frontend lint (TS scripts/test-*.ts unit checks)
# - Rust test/lint/format suite on macOS
# - Rust Windows compile check
# - Dependency audit (cargo audit + pnpm audit --prod)
#
# Failure on any step blocks merge. The release workflow stays in
# `.github/workflows/release.yml` and is dispatched manually.

name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9
        with:
          version: 10.33.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit
      - name: test scripts
        run: pnpm test
      - name: pnpm audit --prod
        run: pnpm audit --prod

  rust:
    name: Rust (test + clippy + fmt)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy
      - name: Install fake grok shim
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fake-grok"
          cat > "$RUNNER_TEMP/fake-grok/grok" <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "--version" ]]; then
            echo "grok fake-ci"
            exit 0
          fi
          echo "fake grok shim for CI" >&2
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fake-grok/grok"
          echo "GROK_BIN=$RUNNER_TEMP/fake-grok/grok" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/fake-grok" >> "$GITHUB_PATH"
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets --features debug-api -- -D warnings
      - name: cargo test --all-targets --features debug-api
        working-directory: src-tauri
        run: cargo test --all-targets --features debug-api

  rust-cross-platform:
    name: Rust check (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: cargo check --all-targets --features debug-api
        working-directory: src-tauri
        run: cargo check --all-targets --features debug-api

  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Install cargo-audit
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          for attempt in 1 2 3; do
            cargo install cargo-audit --locked --version 0.22.1 && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
