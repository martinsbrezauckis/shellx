# shellX CI — pre-merge checks
#
# Runs on every push + pull request against any branch. Gates:
# - Strict TypeScript type-check (including unused-symbol rejection)
# - Complete 1,636-surface source/driver contract on Linux, Windows, and macOS
# - Rust test/lint/format suite on macOS
# - Rust Windows test suite
# - Dependency audit (cargo audit + complete pnpm lockfile audit)
#
# Failure on any step blocks merge. The manually dispatched workflow in
# `.github/workflows/release.yml` is build-only and has read-only contents access.

name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (tsc + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript type-check
        run: pnpm run typecheck
      - name: Audit complete dependency lockfile
        run: pnpm run audit:dependencies

  surface-contracts:
    name: Surface contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify every published surface contract and registered driver test
        run: pnpm run ci:surface-contracts

  rust:
    name: Rust (test + clippy + fmt)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Install fake grok shim
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fake-grok"
          cat > "$RUNNER_TEMP/fake-grok/grok" <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "--version" ]]; then
            echo "grok fake-ci"
            exit 0
          fi
          echo "fake grok shim for CI" >&2
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fake-grok/grok"
          echo "GROK_BIN=$RUNNER_TEMP/fake-grok/grok" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/fake-grok" >> "$GITHUB_PATH"
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets --features debug-api -- -D warnings
      - name: cargo test --all-targets --features debug-api
        working-directory: src-tauri
        run: cargo test --all-targets --features debug-api

  rust-cross-platform:
    name: Rust test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: cargo test --all-targets --features debug-api,windows-test-manifest
        working-directory: src-tauri
        run: cargo test --all-targets --features debug-api,windows-test-manifest

  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.4
      - name: Install cargo-audit
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          for attempt in 1 2 3; do
            cargo install cargo-audit --locked --version 0.22.1 && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: cargo audit
        run: node scripts/check-rustsec.mjs
      - name: Install Grype
        run: go install github.com/anchore/grype/cmd/grype@v0.114.0
      - name: Grype Rust/GHSA audit
        run: node scripts/check-grype-rust.mjs
